name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release anlegen oder ergänzen, z. B. v1.7.3 (leer = nur bauen)'
        required: false
        default: ''

env:
  # Tag-Push oder manueller Start mit Tag: Dateien ans Release hängen
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      # Derselbe Schlüssel wie bei den bisherigen APKs (Secret ANDROID_KEYSTORE_BASE64), sonst lässt sich
      # die APK nicht über eine vorhandene Installation aktualisieren. Ohne Secret: nicht ans Release.
      - id: key
        name: Signaturschlüssel einrichten
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "CM_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - run: flutter build apk --release
        env:
          CM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: |
          v=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9.]+).*/\1/')
          mkdir -p dist && cp build/app/outputs/flutter-apk/app-release.apk "dist/CinemaMax-$v.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: dist/*.apk }

  linux:
    runs-on: ubuntu-22.04 # ältere glibc: läuft auf mehr Distributionen
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev rpm file
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: scripts/package_linux.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux-packages, path: dist/* }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter build windows --release
      # Visual-C++-Laufzeit beilegen, damit die App auch auf frischen Windows-Installationen startet
      - shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" build\windows\x64\runner\Release\
          }
      - shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\cinemamax.iss
      - uses: actions/upload-artifact@v4
        with: { name: windows-setup, path: dist/*.exe }

  # Bei einem Tag (oder manuellem Start mit release_tag): alle Dateien ans Release hängen.
  # Die APK nur, wenn sie mit dem Schlüssel aus den Secrets signiert ist (sonst schlägt das Update
  # vorhandener Installationen fehl); dann wie bisher lokal signieren und von Hand anhängen.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [android, linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - if: needs.android.outputs.signed != 'true'
        run: rm -f out/*.apk
      - id: name
        run: echo "name=CinemaMax ${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.name.outputs.name }}
          files: |
            out/*.apk
            out/*.deb
            out/*.rpm
            out/*.AppImage
            out/*.exe
