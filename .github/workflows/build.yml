name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: build/app/outputs/flutter-apk/app-release.apk }

  linux:
    runs-on: ubuntu-22.04 # ältere glibc: läuft auf mehr Distributionen
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev rpm file
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: scripts/package_linux.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux-packages, path: dist/* }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter build windows --release
      # Visual-C++-Laufzeit beilegen, damit die App auch auf frischen Windows-Installationen startet
      - shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" build\windows\x64\runner\Release\
          }
      - shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\cinemamax.iss
      - uses: actions/upload-artifact@v4
        with: { name: windows-setup, path: dist/*.exe }

  # Bei einem Tag: Linux-Pakete und Windows-Installer ans Release hängen.
  # Die APK wird lokal mit demselben Schlüssel wie bisher signiert und von Hand angehängt,
  # sonst ließe sie sich nicht über eine vorhandene Installation aktualisieren.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.deb
            out/*.rpm
            out/*.AppImage
            out/*.exe

  # VORÜBERGEHEND (nur auf diesem Branch, wird nicht gemergt): Release 1.7.3 per manuellem Start anlegen,
  # Tag v1.7.3 auf dem main-Commit 9133065 (Inhalt identisch mit diesem Branch)
  release-1-7-3:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'ccr-e9291b9d-l4e8af'
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.3
          target_commitish: 9133065f64455f0c332279f59b25dbb5da0f73d1
          name: CinemaMax 1.7.3
          make_latest: 'true'
          body: |
            Schneller, weniger Last für die Server und Fehlerfixes.

            - **Schneller:** Die App öffnet sofort (Startanimation ist jetzt aus, in Einstellungen › Start wieder einschaltbar). Die zuletzt genutzte Liste wird schon beim Start geladen.
            - **Weniger Last für die Server:** Verbindungen werden wiederverwendet, gleiche Anfragen gehen nur einmal raus, Details, Folgen und EPG werden kurz zwischengespeichert. Der Programmführer wird nur neu geladen, wenn er sich geändert hat. Auflösung und Bildrate bleiben maximal.
            - **Fernbedienung:** Einstellungen aus der Seitenleiste öffnen ohne Fokus-Sprung. Die Seitenleiste klappt über dem Inhalt auf, statt ihn zu verschieben.
            - **Seitenwechsel:** Vom Startbildschirm zu IPTV bzw. M3U/Xtream/Stalker liegen nicht mehr beide Seiten übereinander.
            - **Viele Sprachen und Länder:** Lange Auswahllisten (IPTV-Land, Tonspuren) springen zum gewählten Eintrag. Viele Länder einer Liste kommen als Auswahl. Tonspuren zeigen das Format (Stereo/5.1, AAC/Dolby).
            - **Fehlerfixes:** Kein Absturz mehr, wenn bei Live-Sendern eine Tonspur verschwindet. Lange Servernamen passen in die Kopfzeile.

            | Gerät | Datei |
            |---|---|
            | Android & Android TV | CinemaMax-1.7.3.apk |
            | Windows 10 / 11 | CinemaMax-1.7.3-windows-setup.exe |
            | Ubuntu / Mint / Debian | cinemamax_1.7.3_amd64.deb |
            | Fedora / openSUSE | cinemamax-1.7.3-1.x86_64.rpm |
            | Jedes Linux | CinemaMax-1.7.3-x86_64.AppImage |

            Die Android-APK enthält den FFmpeg-Tondecoder von Jellyfin (GPLv3).
          files: |
            out/*.deb
            out/*.rpm
            out/*.AppImage
            out/*.exe
