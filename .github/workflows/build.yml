name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: build/app/outputs/flutter-apk/app-release.apk }

  linux:
    runs-on: ubuntu-22.04 # ältere glibc: läuft auf mehr Distributionen
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev rpm file
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: scripts/package_linux.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux-packages, path: dist/* }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter build windows --release
      # Visual-C++-Laufzeit beilegen, damit die App auch auf frischen Windows-Installationen startet
      - shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" build\windows\x64\runner\Release\
          }
      - shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\cinemamax.iss
      - uses: actions/upload-artifact@v4
        with: { name: windows-setup, path: dist/*.exe }

  # Bei einem Tag: Linux-Pakete und Windows-Installer ans Release hängen.
  # Die APK wird lokal mit demselben Schlüssel wie bisher signiert und von Hand angehängt,
  # sonst ließe sie sich nicht über eine vorhandene Installation aktualisieren.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.deb
            out/*.rpm
            out/*.AppImage
            out/*.exe
