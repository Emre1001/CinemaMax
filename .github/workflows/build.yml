name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: build/app/outputs/flutter-apk/app-release.apk }

  linux:
    runs-on: ubuntu-22.04 # ältere glibc: läuft auf mehr Distributionen
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev rpm file
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: scripts/package_linux.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux-packages, path: dist/* }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter build windows --release
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath CinemaMax-windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: CinemaMax-windows.zip }
